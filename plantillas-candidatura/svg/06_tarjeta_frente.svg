<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLANTILLA: Tarjeta de presentación · frente  (340 x 189 px)
  PALETA: institucional
  Capas (de abajo hacia arriba): 01 FONDO · 02 FORMAS · 03 FOTO · 04 SOBRE FOTO · 05 TEXTOS · 06 DATOS · 07 LEGAL · 08 GUÍAS
  Para recolorear: edita el bloque <style> (clases .c-tinta, .c-azul, .c-acento...).
  Para cambiar la foto: reemplaza el archivo assets/foto-candidato.jpg.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="340" height="189" viewBox="0 0 340 189"
     version="1.1">
  <title>Tarjeta de presentación · frente</title>
  <desc>90 x 50 mm</desc>
  <style>
  .c-tinta{fill:#0F1B26}
  .c-azul{fill:#14405F}
  .c-acento{fill:#E2542C}
  .c-crema{fill:#F6F1E8}
  .c-arena{fill:#E3D7C6}
  .c-gris{fill:#6E7780}
  .c-blanco{fill:#FFFFFF}
  .f-display{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif;font-weight:900}
  .f-semi{font-family:'Segoe UI Semibold','Segoe UI',Arial,sans-serif;font-weight:600}
  .f-body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-weight:400}
  </style>
  <g id="capa-01" inkscape:groupmode="layer" inkscape:label="01 FONDO">
    <rect id="fondo-crema" inkscape:label="Fondo crema" x="0" y="0" width="340" height="189" rx="0" fill="#F6F1E8"/>
  </g>
  <g id="capa-02" inkscape:groupmode="layer" inkscape:label="02 FORMAS">
    <rect id="barra-acento" inkscape:label="Barra acento" x="0" y="0" width="9" height="189" rx="0" fill="#E2542C"/>
    <rect id="regla-acento" inkscape:label="Regla acento" x="24" y="134" width="44" height="3.5" rx="0" fill="#E2542C"/>
  </g>
  <g id="capa-05" inkscape:groupmode="layer" inkscape:label="05 TEXTOS">
    <text x="24" y="88" class="f-semi" font-size="11" letter-spacing="1.32" fill="#14405F">NOMBRE</text>
    <g id="apellido" inkscape:label="Apellido">
        <text x="24" y="122" class="f-display" font-size="29" letter-spacing="0.0" fill="#0F1B26">APELLIDO</text>
      </g>
    <text x="24" y="152" class="f-semi" font-size="9.5" letter-spacing="0.95" fill="#14405F">CANDIDATO A ALCALDE</text>
  </g>
  <g id="capa-06" inkscape:groupmode="layer" inkscape:label="06 DATOS">
    <g id="logo-reemplazar" inkscape:label="Logo (reemplazar)"><rect x="24" y="18" width="104" height="24" rx="2" fill="none" stroke="#0F1B26" stroke-width="1.4" stroke-dasharray="7 5" opacity="0.55"/><text x="76.0" y="33.24" class="f-semi" font-size="9" letter-spacing="1.44" text-anchor="middle" fill="#0F1B26" opacity="0.7">TU LOGO</text></g>
    <text x="316" y="34" class="f-display" font-size="11" letter-spacing="0.66" fill="#E2542C" text-anchor="end">26 OCT</text>
    <text x="316" y="48" class="f-semi" font-size="7.5" letter-spacing="1.2" fill="#6E7780" text-anchor="end">VOTA</text>
    <text x="24" y="174" class="f-body" font-size="8.5" letter-spacing="0.0" fill="#6E7780">+56 9 1234 5678  ·  @TUUSUARIO</text>
  </g>
  <g id="capa-08" inkscape:groupmode="layer" inkscape:label="08 GUÍAS" style="display:none">
    <rect id="zona-segura" inkscape:label="Zona segura" x="12" y="12" width="316" height="165" rx="0" fill="none" stroke="#E2542C" stroke-width="1" stroke-dasharray="8 6"/>
    <text x="18" y="0" class="f-semi" font-size="11" letter-spacing="0.88" fill="#E2542C">ZONA SEGURA · margen 12px</text>
  </g>
</svg>
