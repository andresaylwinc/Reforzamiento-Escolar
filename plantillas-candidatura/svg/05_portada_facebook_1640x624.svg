<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLANTILLA: Portada Facebook 1640 x 624  (1640 x 624 px)
  PALETA: institucional
  Capas (de abajo hacia arriba): 01 FONDO · 02 FORMAS · 03 FOTO · 04 SOBRE FOTO · 05 TEXTOS · 06 DATOS · 07 LEGAL · 08 GUÍAS
  Para recolorear: edita el bloque <style> (clases .c-tinta, .c-azul, .c-acento...).
  Para cambiar la foto: reemplaza el archivo assets/foto-candidato.jpg.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1640" height="624" viewBox="0 0 1640 624"
     version="1.1">
  <title>Portada Facebook 1640 x 624</title>
  <desc>Cabecera de página / perfil</desc>
  <style>
  .c-tinta{fill:#0F1B26}
  .c-azul{fill:#14405F}
  .c-acento{fill:#E2542C}
  .c-crema{fill:#F6F1E8}
  .c-arena{fill:#E3D7C6}
  .c-gris{fill:#6E7780}
  .c-blanco{fill:#FFFFFF}
  .f-display{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif;font-weight:900}
  .f-semi{font-family:'Segoe UI Semibold','Segoe UI',Arial,sans-serif;font-weight:600}
  .f-body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-weight:400}
  </style>
  <g id="capa-01" inkscape:groupmode="layer" inkscape:label="01 FONDO">
    <rect id="fondo-tinta" inkscape:label="Fondo tinta" x="0" y="0" width="1640" height="624" rx="0" fill="#0F1B26"/>
  </g>
  <g id="capa-02" inkscape:groupmode="layer" inkscape:label="02 FORMAS">
    <rect id="barra-acento" inkscape:label="Barra acento" x="0" y="0" width="14" height="624" rx="0" fill="#E2542C"/>
    <rect id="marco-acento-foto" inkscape:label="Marco acento foto" x="1062" y="0" width="14" height="624" rx="0" fill="#E2542C"/>
  </g>
  <g id="capa-03" inkscape:groupmode="layer" inkscape:label="03 FOTO">
    <image x="1076" y="0" width="564" height="624" preserveAspectRatio="xMidYMid slice" href="../assets/foto-candidato.jpg" xlink:href="../assets/foto-candidato.jpg" id="foto-del-candidato" inkscape:label="Foto del candidato"/>
  </g>
  <g id="capa-05" inkscape:groupmode="layer" inkscape:label="05 TEXTOS">
    <text x="80" y="216" class="f-semi" font-size="20" letter-spacing="3.6" fill="#E2542C">ELECCIONES 2028 · COMUNA</text>
    <text x="80" y="286" class="f-semi" font-size="34" letter-spacing="3.4" fill="#F6F1E8">NOMBRE</text>
    <g id="apellido-titular" inkscape:label="Apellido (titular)">
        <text x="80" y="384" class="f-display" font-size="92" letter-spacing="0.0" fill="#F6F1E8">APELLIDO</text>
      </g>
    <text x="80" y="438" class="f-semi" font-size="26" letter-spacing="3.12" fill="#E3D7C6">CANDIDATO A ALCALDE</text>
    <g id="lema" inkscape:label="Lema">
        <text x="80" y="500" class="f-body" font-size="28" letter-spacing="0.0" fill="#E3D7C6">POR UN BARRIO SEGURO, LIMPIO Y CON OPORTUNIDADES</text>
      </g>
  </g>
  <g id="capa-06" inkscape:groupmode="layer" inkscape:label="06 DATOS">
    <g id="logo-reemplazar" inkscape:label="Logo (reemplazar)"><rect x="80" y="56" width="150" height="44" rx="2" fill="none" stroke="#F6F1E8" stroke-width="1.4" stroke-dasharray="7 5" opacity="0.55"/><text x="155.0" y="82.68" class="f-semi" font-size="13" letter-spacing="2.08" text-anchor="middle" fill="#F6F1E8" opacity="0.7">TU LOGO</text></g>
    <text x="80" y="572" class="f-semi" font-size="18" letter-spacing="2.16" fill="#E2542C">@TUUSUARIO  ·  26 DE OCTUBRE</text>
  </g>
  <g id="capa-08" inkscape:groupmode="layer" inkscape:label="08 GUÍAS" style="display:none">
    <rect id="zona-segura" inkscape:label="Zona segura" x="40" y="40" width="1560" height="544" rx="0" fill="none" stroke="#E2542C" stroke-width="1" stroke-dasharray="8 6"/>
    <text x="46" y="28" class="f-semi" font-size="11" letter-spacing="0.88" fill="#E2542C">ZONA SEGURA · margen 40px</text>
  </g>
</svg>
