<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLANTILLA: Story / Reel 1080 x 1920  (1080 x 1920 px)
  PALETA: institucional
  Capas (de abajo hacia arriba): 01 FONDO · 02 FORMAS · 03 FOTO · 04 SOBRE FOTO · 05 TEXTOS · 06 DATOS · 07 LEGAL · 08 GUÍAS
  Para recolorear: edita el bloque <style> (clases .c-tinta, .c-azul, .c-acento...).
  Para cambiar la foto: reemplaza el archivo assets/foto-candidato.jpg.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1080" height="1920" viewBox="0 0 1080 1920"
     version="1.1">
  <title>Story / Reel 1080 x 1920</title>
  <desc>3 prioridades · historias de Instagram, estados, reels</desc>
  <style>
  .c-tinta{fill:#0F1B26}
  .c-azul{fill:#14405F}
  .c-acento{fill:#E2542C}
  .c-crema{fill:#F6F1E8}
  .c-arena{fill:#E3D7C6}
  .c-gris{fill:#6E7780}
  .c-blanco{fill:#FFFFFF}
  .f-display{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif;font-weight:900}
  .f-semi{font-family:'Segoe UI Semibold','Segoe UI',Arial,sans-serif;font-weight:600}
  .f-body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-weight:400}
  </style>
  <g id="capa-01" inkscape:groupmode="layer" inkscape:label="01 FONDO">
    <rect id="fondo-crema" inkscape:label="Fondo crema" x="0" y="0" width="1080" height="1920" rx="0" fill="#F6F1E8"/>
  </g>
  <g id="capa-02" inkscape:groupmode="layer" inkscape:label="02 FORMAS">
    <rect id="bloque-superior" inkscape:label="Bloque superior" x="0" y="0" width="1080" height="720" rx="0" fill="#0F1B26"/>
    <rect id="separador-acento" inkscape:label="Separador acento" x="0" y="720" width="1080" height="10" rx="0" fill="#E2542C"/>
    <rect id="marco-desplazado" inkscape:label="Marco desplazado" x="590" y="66" width="412" height="576" rx="0" fill="#E2542C"/>
    <rect id="boton-vota" inkscape:label="Botón VOTA" x="64" y="640" width="218" height="56" rx="28" fill="#E2542C"/>
    <rect id="tarjeta-01" inkscape:label="Tarjeta 01" x="64" y="910" width="952" height="210" rx="0" fill="#FFFFFF"/>
    <rect id="barra-tarjeta-01" inkscape:label="Barra tarjeta 01" x="64" y="910" width="12" height="210" rx="0" fill="#E2542C"/>
    <rect id="borde-tarjeta-01" inkscape:label="Borde tarjeta 01" x="64" y="910" width="952" height="210" rx="0" fill="none" stroke="#E3D7C6" stroke-width="1"/>
    <rect id="tarjeta-02" inkscape:label="Tarjeta 02" x="64" y="1140" width="952" height="210" rx="0" fill="#FFFFFF"/>
    <rect id="barra-tarjeta-02" inkscape:label="Barra tarjeta 02" x="64" y="1140" width="12" height="210" rx="0" fill="#E2542C"/>
    <rect id="borde-tarjeta-02" inkscape:label="Borde tarjeta 02" x="64" y="1140" width="952" height="210" rx="0" fill="none" stroke="#E3D7C6" stroke-width="1"/>
    <rect id="tarjeta-03" inkscape:label="Tarjeta 03" x="64" y="1370" width="952" height="210" rx="0" fill="#FFFFFF"/>
    <rect id="barra-tarjeta-03" inkscape:label="Barra tarjeta 03" x="64" y="1370" width="12" height="210" rx="0" fill="#E2542C"/>
    <rect id="borde-tarjeta-03" inkscape:label="Borde tarjeta 03" x="64" y="1370" width="952" height="210" rx="0" fill="none" stroke="#E3D7C6" stroke-width="1"/>
    <rect id="pie" inkscape:label="Pie" x="0" y="1640" width="1080" height="280" rx="0" fill="#0F1B26"/>
    <rect id="boton-vota-2" inkscape:label="Botón VOTA" x="748" y="1704" width="268" height="64" rx="32" fill="#F6F1E8"/>
  </g>
  <g id="capa-03" inkscape:groupmode="layer" inkscape:label="03 FOTO">
    <image x="602" y="78" width="412" height="576" preserveAspectRatio="xMidYMid slice" href="../assets/foto-candidato.jpg" xlink:href="../assets/foto-candidato.jpg" id="foto-del-candidato" inkscape:label="Foto del candidato"/>
  </g>
  <g id="capa-05" inkscape:groupmode="layer" inkscape:label="05 TEXTOS">
    <text x="64" y="216" class="f-semi" font-size="22" letter-spacing="3.96" fill="#E2542C">ELECCIONES 2028</text>
    <text x="64" y="290" class="f-semi" font-size="34" letter-spacing="3.4" fill="#F6F1E8">NOMBRE</text>
    <g id="apellido-titular" inkscape:label="Apellido (titular)">
        <text x="64" y="378" class="f-display" font-size="76" letter-spacing="0.0" fill="#F6F1E8">APELLIDO</text>
      </g>
    <text x="64" y="430" class="f-semi" font-size="24" letter-spacing="2.4" fill="#E3D7C6">CANDIDATO A ALCALDE</text>
    <g id="lema" inkscape:label="Lema">
        <text x="64" y="512.0" class="f-body" font-size="27" letter-spacing="0.0" fill="#E3D7C6">POR UN BARRIO SEGURO, LIMPIO Y CON</text>
        <text x="64" y="549.26" class="f-body" font-size="27" letter-spacing="0.0" fill="#E3D7C6">OPORTUNIDADES</text>
      </g>
    <text x="173" y="678" class="f-display" font-size="26" letter-spacing="2.6" fill="#F6F1E8" text-anchor="middle">VOTA</text>
    <g id="titulo-de-seccion" inkscape:label="Título de sección">
        <text x="64" y="826" class="f-display" font-size="54" letter-spacing="0.0" fill="#0F1B26">MIS 3 PRIORIDADES</text>
      </g>
    <text x="104" y="996" class="f-display" font-size="44" letter-spacing="0.0" fill="#E2542C">01</text>
    <text x="192" y="996" class="f-display" font-size="34" letter-spacing="0.0" fill="#0F1B26">SEGURIDAD REAL</text>
    <text x="192" y="1050.0" class="f-body" font-size="26" letter-spacing="0.0" fill="#6E7780">Más patrullaje municipal, cámaras en los pasajes y alarmas</text>
        <text x="192" y="1083.8" class="f-body" font-size="26" letter-spacing="0.0" fill="#6E7780">comunitarias.</text>
    <text x="104" y="1226" class="f-display" font-size="44" letter-spacing="0.0" fill="#E2542C">02</text>
    <text x="192" y="1226" class="f-display" font-size="34" letter-spacing="0.0" fill="#0F1B26">ÁREAS VERDES</text>
    <text x="192" y="1280.0" class="f-body" font-size="26" letter-spacing="0.0" fill="#6E7780">Recuperar las plazas abandonadas y arborizar cada calle del barrio.</text>
    <text x="104" y="1456" class="f-display" font-size="44" letter-spacing="0.0" fill="#E2542C">03</text>
    <text x="192" y="1456" class="f-display" font-size="34" letter-spacing="0.0" fill="#0F1B26">EMPLEO LOCAL</text>
    <text x="192" y="1510.0" class="f-body" font-size="26" letter-spacing="0.0" fill="#6E7780">Oficina municipal de empleo y ferias de emprendimiento cada mes.</text>
    <text x="64" y="1720" class="f-semi" font-size="26" letter-spacing="3.64" fill="#F6F1E8">COMPARTE ESTA HISTORIA</text>
    <text x="882" y="1743" class="f-display" font-size="24" letter-spacing="2.88" fill="#0F1B26" text-anchor="middle">VOTA</text>
  </g>
  <g id="capa-06" inkscape:groupmode="layer" inkscape:label="06 DATOS">
    <g id="logo-reemplazar" inkscape:label="Logo (reemplazar)"><rect x="64" y="62" width="150" height="42" rx="2" fill="none" stroke="#F6F1E8" stroke-width="1.4" stroke-dasharray="7 5" opacity="0.55"/><text x="139.0" y="87.68" class="f-semi" font-size="13" letter-spacing="2.08" text-anchor="middle" fill="#F6F1E8" opacity="0.7">TU LOGO</text></g>
    <text x="64" y="866" class="f-semi" font-size="19" letter-spacing="2.28" fill="#6E7780">LO QUE VOY A HACER EN EL PRIMER AÑO</text>
    <text x="64" y="1790" class="f-display" font-size="34" letter-spacing="0.0" fill="#E2542C">@TUUSUARIO</text>
  </g>
  <g id="capa-07" inkscape:groupmode="layer" inkscape:label="07 LEGAL">
    <g id="leyenda-legal" inkscape:label="Leyenda legal">
        <text x="64" y="1862" class="f-semi" font-size="12" letter-spacing="1.2" fill="#F6F1E8">PROPAGANDA ELECTORAL · [LEYENDA LEGAL]</text>
      </g>
  </g>
  <g id="capa-08" inkscape:groupmode="layer" inkscape:label="08 GUÍAS" style="display:none">
    <rect id="zona-segura" inkscape:label="Zona segura" x="40" y="40" width="1000" height="1840" rx="0" fill="none" stroke="#E2542C" stroke-width="1" stroke-dasharray="8 6"/>
    <text x="46" y="28" class="f-semi" font-size="11" letter-spacing="0.88" fill="#E2542C">ZONA SEGURA · margen 40px</text>
  </g>
</svg>
