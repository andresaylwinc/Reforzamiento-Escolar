<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLANTILLA: Afiche A3  (1123 x 1587 px)
  PALETA: institucional
  Capas (de abajo hacia arriba): 01 FONDO · 02 FORMAS · 03 FOTO · 04 SOBRE FOTO · 05 TEXTOS · 06 DATOS · 07 LEGAL · 08 GUÍAS
  Para recolorear: edita el bloque <style> (clases .c-tinta, .c-azul, .c-acento...).
  Para cambiar la foto: reemplaza el archivo assets/foto-candidato.jpg.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1123" height="1587" viewBox="0 0 1123 1587"
     version="1.1">
  <title>Afiche A3</title>
  <desc>Afiche de calle 297 x 420 mm</desc>
  <style>
  .c-tinta{fill:#0F1B26}
  .c-azul{fill:#14405F}
  .c-acento{fill:#E2542C}
  .c-crema{fill:#F6F1E8}
  .c-arena{fill:#E3D7C6}
  .c-gris{fill:#6E7780}
  .c-blanco{fill:#FFFFFF}
  .f-display{font-family:'Arial Black','Segoe UI Black',Impact,sans-serif;font-weight:900}
  .f-semi{font-family:'Segoe UI Semibold','Segoe UI',Arial,sans-serif;font-weight:600}
  .f-body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-weight:400}
  </style>
  <g id="capa-01" inkscape:groupmode="layer" inkscape:label="01 FONDO">
    <rect id="fondo-crema" inkscape:label="Fondo crema" x="0" y="0" width="1123" height="1587" rx="0" fill="#F6F1E8"/>
  </g>
  <g id="capa-02" inkscape:groupmode="layer" inkscape:label="02 FORMAS">
    <rect id="bloque-superior" inkscape:label="Bloque superior" x="0" y="0" width="1123" height="640" rx="0" fill="#0F1B26"/>
    <rect id="separador-acento" inkscape:label="Separador acento" x="0" y="628" width="1123" height="12" rx="0" fill="#E2542C"/>
  </g>
  <g id="capa-03" inkscape:groupmode="layer" inkscape:label="03 FOTO">
    <image x="0" y="640" width="1123" height="947" preserveAspectRatio="xMidYMid slice" href="../assets/foto-candidato.jpg" xlink:href="../assets/foto-candidato.jpg" id="foto-del-candidato" inkscape:label="Foto del candidato"/>
  </g>
  <g id="capa-04" inkscape:groupmode="layer" inkscape:label="04 SOBRE FOTO">
    <rect id="banda-inferior" inkscape:label="Banda inferior" x="0" y="1310" width="1123" height="277" rx="0" fill="#0F1B26"/>
  </g>
  <g id="capa-05" inkscape:groupmode="layer" inkscape:label="05 TEXTOS">
    <text x="64" y="214" class="f-semi" font-size="24" letter-spacing="4.32" fill="#E2542C">ELECCIONES 2028</text>
    <text x="64" y="318" class="f-semi" font-size="46" letter-spacing="4.6" fill="#F6F1E8">NOMBRE</text>
    <g id="apellido-titular" inkscape:label="Apellido (titular)">
        <text x="64" y="456" class="f-display" font-size="128" letter-spacing="0.0" fill="#F6F1E8">APELLIDO</text>
      </g>
    <text x="64" y="526" class="f-semi" font-size="30" letter-spacing="3.6" fill="#E3D7C6">CANDIDATO A ALCALDE</text>
    <g id="lema" inkscape:label="Lema">
        <text x="64" y="1392.0" class="f-body" font-size="31" letter-spacing="0.0" fill="#F6F1E8">POR UN BARRIO SEGURO, LIMPIO Y</text>
        <text x="64" y="1434.78" class="f-body" font-size="31" letter-spacing="0.0" fill="#F6F1E8">CON OPORTUNIDADES</text>
      </g>
    <g id="llamado-al-voto" inkscape:label="Llamado al voto">
        <text x="1059" y="1436" class="f-display" font-size="56" letter-spacing="0.0" fill="#E2542C" text-anchor="end">VOTA POR MÍ</text>
      </g>
    <g id="fecha" inkscape:label="Fecha">
        <text x="1059" y="1492" class="f-display" font-size="22" letter-spacing="1.32" fill="#F6F1E8" text-anchor="end">26 DE OCTUBRE</text>
      </g>
  </g>
  <g id="capa-06" inkscape:groupmode="layer" inkscape:label="06 DATOS">
    <g id="logo-reemplazar" inkscape:label="Logo (reemplazar)"><rect x="64" y="56" width="180" height="54" rx="2" fill="none" stroke="#F6F1E8" stroke-width="1.4" stroke-dasharray="7 5" opacity="0.55"/><text x="154.0" y="88.76" class="f-semi" font-size="16" letter-spacing="2.56" text-anchor="middle" fill="#F6F1E8" opacity="0.7">TU LOGO</text></g>
    <text x="64" y="1530" class="f-semi" font-size="20" letter-spacing="2.4" fill="#E3D7C6">@TUUSUARIO</text>
  </g>
  <g id="capa-08" inkscape:groupmode="layer" inkscape:label="08 GUÍAS" style="display:none">
    <rect id="zona-segura" inkscape:label="Zona segura" x="45" y="45" width="1033" height="1497" rx="0" fill="none" stroke="#E2542C" stroke-width="1" stroke-dasharray="8 6"/>
    <text x="51" y="33" class="f-semi" font-size="11" letter-spacing="0.88" fill="#E2542C">ZONA SEGURA · margen 45px</text>
  </g>
</svg>
