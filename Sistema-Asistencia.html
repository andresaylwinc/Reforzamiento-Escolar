<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3B57">
<title>Reforzamiento · Registro de clases</title>
<style>
/* ============================================================
   Sistema de reforzamiento — hoja de estilos
   Diseño simple, alto contraste, pensado para celular y computador.
   ============================================================ */
:root{
  --ink:#16232E;
  --muted:#5B6B7A;
  --line:#DCE3EA;
  --line-strong:#C3CEDA;
  --bg:#F2F5F7;
  --card:#FFFFFF;
  --primary:#1F3B57;
  --primary-600:#2A4F73;
  --primary-soft:#E8EEF5;
  --accent:#2F6F4E;
  --accent-soft:#E4F1EA;
  --danger:#B42318;
  --danger-soft:#FDEBE9;
  --warn:#8A5A0B;
  --warn-soft:#FBF1DE;
  --radius:14px;
  --shadow:0 1px 2px rgba(22,35,46,.06),0 8px 24px -12px rgba(22,35,46,.18);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);color:var(--ink);background:var(--bg);
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink)}
a{color:var(--primary-600)}
:focus-visible{outline:3px solid #7AA7D9;outline-offset:2px;border-radius:6px}

/* ------------------------------ barra ------------------------------ */
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{
  width:30px;height:30px;border-radius:9px;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-size:15px;font-weight:800
}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{
  border:1px solid transparent;background:transparent;color:var(--muted);
  padding:8px 13px;border-radius:10px;font-weight:600;font-size:14px;display:flex;gap:7px;align-items:center
}
.tab:hover{background:var(--primary-soft);color:var(--primary)}
.tab[aria-selected="true"]{background:var(--primary);color:#fff}
.tab .ic{font-size:15px;line-height:1}

/* ------------------------------ layout ----------------------------- */
main{max-width:1120px;margin:0 auto;padding:22px 18px 90px}
.view{display:none}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.card-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-head h2{margin:0;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.card-head .step{
  width:22px;height:22px;border-radius:7px;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none
}
.card-head .hint{color:var(--muted);font-size:13px;margin-left:auto}
.card-body{padding:18px}
.card-body.tight{padding:10px}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field .hint{font-size:12px;color:var(--muted)}
input[type=date],select,input[type=text],input[type=search],textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:10px;background:#fff;
  transition:border-color .15s,box-shadow .15s;min-height:44px
}
input:focus,select:focus,textarea:focus{border-color:var(--primary-600);box-shadow:0 0 0 3px rgba(42,79,115,.14);outline:none}
textarea{resize:vertical;min-height:44px;line-height:1.4}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235B6B7A' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}

/* ------------------------------ botones ---------------------------- */
.btn{
  border:1px solid var(--line-strong);background:#fff;color:var(--ink);
  padding:10px 16px;border-radius:10px;font-weight:650;display:inline-flex;align-items:center;gap:8px;
  min-height:42px;transition:background .15s,border-color .15s,transform .05s
}
.btn:hover{background:#F7F9FB;border-color:#AEBBC9}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-600);border-color:var(--primary-600)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{background:#276043;border-color:#276043}
.btn-ghost{background:transparent;border-color:transparent;color:var(--primary-600)}
.btn-ghost:hover{background:var(--primary-soft)}
.btn-danger{color:var(--danger);border-color:#E7C4C0}
.btn-danger:hover{background:var(--danger-soft)}
.btn-sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .ic{font-size:15px;line-height:1}

/* ------------------------------ avisos ----------------------------- */
.banner{
  display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:11px;
  font-size:13.5px;margin:0 0 16px;border:1px solid transparent
}
.banner .ic{font-size:16px;line-height:1.2}
.banner.info{background:var(--primary-soft);border-color:#CFDCEA;color:#1D3B57}
.banner.warn{background:var(--warn-soft);border-color:#EBD9B4;color:#6E4A08}
.banner.ok{background:var(--accent-soft);border-color:#C4E0D1;color:#245741}
.banner.err{background:var(--danger-soft);border-color:#EBC5C1;color:#8C1D14}
.banner strong{font-weight:700}

/* -------------------------- tabla de curso ------------------------- */
.course-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:#FAFCFD;border-bottom:1px solid var(--line)}
.course-bar .who{font-weight:700}
.course-bar .who small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.course-bar .spacer{margin-left:auto}
.counter{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.counter b{color:var(--accent);font-weight:700}

.legend{display:none}
.rows{padding:6px 12px 12px}
.rows-head{display:grid;grid-template-columns:minmax(150px,1.4fr) 132px 208px minmax(180px,1.6fr);gap:12px;padding:6px 18px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row .cell{display:flex;flex-direction:column;gap:4px;min-width:0}
.row .mlabel{display:none}
.row{
  display:grid;grid-template-columns:minmax(150px,1.4fr) 132px 208px minmax(180px,1.6fr);
  gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid #EDF1F5;
}
.row:last-child{border-bottom:none}
.row.off{background:#FFF8F7}
.row.off .row-name{color:#8A3A31}
.row.invalid{background:#FFF8F7;box-shadow:inset 3px 0 0 var(--danger)}
.row-name{display:flex;gap:9px;align-items:center;min-width:0;font-weight:600}
.row-name .idx{font-size:11px;color:#9AA8B5;width:16px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.row-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-name .nm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;white-space:nowrap}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:#fff}
.seg button{
  border:0;background:#fff;color:var(--muted);padding:0;min-width:56px;height:40px;
  font-weight:700;font-size:14px;border-right:1px solid var(--line)
}
.seg button:last-child{border-right:0}
.seg button:hover{background:#F4F7FA}
.seg button.on[data-k="P"]{background:var(--accent);color:#fff}
.seg button.on[data-k="A"]{background:var(--danger);color:#fff}
.seg.eval button{min-width:42px}
.seg button.on[data-k="0"]{background:#7A8896;color:#fff}
.seg button.on[data-k="1"]{background:#B4530B;color:#fff}
.seg button.on[data-k="2"]{background:#2F6F4E;color:#fff}
.seg button.on[data-k="3"]{background:#1F6B3F;color:#fff}
.seg.disabled{opacity:.45;pointer-events:none}
.seg button:disabled{background:#F4F6F8;color:#A9B5C0}

.obs{display:flex;flex-direction:column;gap:6px;min-width:0}
.obs-toggle{
  border:1px dashed var(--line-strong);background:#fff;color:var(--muted);border-radius:9px;
  padding:7px 10px;font-size:13px;text-align:left;font-weight:500;min-height:38px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.obs-toggle:hover{border-color:var(--primary-600);color:var(--primary-600)}
.obs-toggle.has{border-style:solid;border-color:#CFDCEA;background:#F7FAFC;color:var(--ink)}
.obs textarea{font-size:14px;min-height:64px}
.obs .tags{display:flex;gap:5px;flex-wrap:wrap}

.footer-bar{
  position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap
}
.footer-bar .sum{font-size:13.5px;color:var(--muted)}
.footer-bar .sum b{color:var(--ink)}
.footer-bar .spacer{margin-left:auto}
.footer-bar .miss{color:var(--danger);font-weight:600}

/* ------------------------------ panel ------------------------------ */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em;display:flex;gap:6px;align-items:center}
.kpi .val{font-size:28px;font-weight:750;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.good .val{color:var(--accent)}
.kpi.bad .val{color:var(--danger)}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;align-items:start}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.chart-card h3{margin:0 0 4px;font-size:14px}
.chart-card p.desc{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.chart-wrap{position:relative}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .axl{font-size:10px;fill:#8795A3}
.chart .grid-l{stroke:#EDF1F5;stroke-width:1}
.chart .lbl{font-size:10.5px;fill:#5B6B7A}
.chart .ttl{font-size:11px;fill:#5B6B7A;font-weight:700}

.dist{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.dist-row{display:grid;grid-template-columns:34px 1fr 92px;gap:10px;align-items:center;font-size:13px}
.dist-row .n{font-weight:800;font-size:15px;text-align:center;color:#fff;border-radius:8px;height:26px;display:grid;place-items:center}
.dist-row .track{display:block;height:10px;background:#EEF2F6;border-radius:6px;overflow:hidden}
.dist-row .fill{display:block;height:100%;border-radius:6px}
.dist-row .txt{color:var(--muted);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap
}
table.tbl td{padding:10px;border-bottom:1px solid #EDF1F5;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr.clickable{cursor:pointer}
table.tbl tr.clickable:hover{background:#F7FAFC}
.bar-cell{display:flex;align-items:center;gap:9px;min-width:130px}
.bar-cell .track{display:block;flex:1;height:8px;background:#EEF2F6;border-radius:5px;overflow:hidden;min-width:60px}
.bar-cell .fill{display:block;height:100%;border-radius:5px}
.bar-cell .v{font-variant-numeric:tabular-nums;font-weight:650;font-size:12.5px;width:46px;text-align:right}

.alert-list{display:grid;gap:10px}
.alert{
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff
}
.alert.hi{border-color:#EBC5C1;background:#FFF9F8}
.alert.mid{border-color:#EBD9B4;background:#FFFCF5}
.alert .who{font-weight:700}
.alert .why{color:var(--muted);font-size:12.5px;margin-top:2px}
.alert .obs-line{color:var(--muted);font-size:12.5px;margin-top:5px;font-style:italic}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.hi{background:var(--danger-soft);color:#8C1D14}
.pill.mid{background:var(--warn-soft);color:#6E4A08}
.pill.low{background:var(--primary-soft);color:#1D3B57}
.pill.ok{background:var(--accent-soft);color:#245741}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters .field{min-width:150px}
.filters .spacer{margin-left:auto}

.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:8px}

pre.draft{
  background:#FBFCFD;border:1px solid var(--line);border-radius:11px;padding:16px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;line-height:1.6;
  white-space:pre-wrap;max-height:420px;overflow:auto;margin:0;color:#233240
}
.obs-item{padding:11px 0;border-bottom:1px solid #EDF1F5}
.obs-item:last-child{border:none}
.obs-item .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.obs-item .txt{margin-top:4px;font-size:13.5px}

/* ------------------------------ modal ------------------------------ */
.modal-bg{
  position:fixed;inset:0;background:rgba(18,28,38,.42);display:none;place-items:center;z-index:80;padding:18px
}
.modal-bg.on{display:grid}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 60px -12px rgba(0,0,0,.4)}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal header h3{margin:0;font-size:16px}
.modal header .x{margin-left:auto;border:0;background:transparent;font-size:20px;color:var(--muted);width:34px;height:34px;border-radius:8px}
.modal header .x:hover{background:#F1F4F7}
.modal .body{padding:18px}
.modal .foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ------------------------------ toast ------------------------------ */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:100;opacity:0;transition:.22s;pointer-events:none;max-width:92vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-in{background:#16232E;color:#fff;padding:12px 18px;border-radius:11px;box-shadow:0 12px 30px -8px rgba(0,0,0,.5);font-size:14px;display:flex;gap:9px;align-items:center}
.toast-in.ok{background:#1F5A3E}
.toast-in.err{background:#8C1D14}

.tag-btn{border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.tag-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.small{font-size:12.5px;color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.row-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------------------------- responsive --------------------------- */
@media (max-width:960px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .charts{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .row,.rows-head{grid-template-columns:minmax(150px,1.2fr) 120px 180px minmax(140px,1fr);gap:10px}
}
@media (max-width:720px){
  body{padding-bottom:64px}
  main{padding:14px 12px 80px}
  .topbar-in{padding:8px 12px}
  .brand small{display:none}
  .tabs{
    position:fixed;left:0;right:0;bottom:0;margin:0;background:#fff;border-top:1px solid var(--line);
    padding:6px 4px;justify-content:space-around;z-index:50;gap:0;flex-wrap:nowrap
  }
  .tab{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;flex:1;border-radius:8px;color:#5B6B7A}
  .tab .ic{font-size:18px}
  .tab[aria-selected="true"]{background:transparent;color:var(--primary)}
  .tab[aria-selected="true"] .ic{transform:translateY(-1px)}
  .grid3{grid-template-columns:1fr}
  .row{display:grid;grid-template-columns:1fr 1.12fr;grid-template-areas:"name name" "a e" "obs obs";
    align-items:start;gap:7px 10px;padding:11px 12px;background:#FBFCFD;border:1px solid var(--line);
    border-radius:12px;margin-bottom:9px}
  .row .row-name{grid-area:name}
  .row .cell-asist{grid-area:a}
  .row .cell-eval{grid-area:e}
  .row .obs{grid-area:obs}
  .row:last-child{margin-bottom:0}
  .row .cell{display:flex;flex-direction:column;gap:4px}
  .row .mlabel{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .row .seg{width:100%;display:flex}
  .row .seg button{flex:1;height:46px;min-width:0;font-size:15px}
  .row .seg.eval button{height:44px}
  .rows{padding:10px}
  .rows-head{display:none}
  .course-bar{flex-direction:column;align-items:stretch;gap:10px}
  .course-bar .spacer{display:none}
  .course-bar input[type=search]{max-width:none!important}
  .course-bar .btn{width:100%;justify-content:center}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .val{font-size:23px}
  .card-head{padding:13px 14px}
  .card-body{padding:14px}
  .footer-bar{padding:10px 12px;bottom:56px}
  .footer-bar .sum{font-size:12.5px}
  .footer-bar .btn{flex:1}
  .filters{flex-direction:column;align-items:stretch}
  .filters .field{min-width:0;width:100%}
  .filters .spacer{display:none}
  .filters .btn{width:100%;justify-content:center}
  table.tbl{font-size:12.5px}
  table.tbl th,table.tbl td{padding:8px 6px}
  .hide-sm{display:none}
}
@media (max-width:420px){
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:12px}
  .kpi .val{font-size:21px}
  .kpi .lbl{font-size:10px}
  .kpi .sub{font-size:11px}
}
@media print{
  .topbar,.footer-bar,.tabs{display:none}
}


/* ------------------- cuatro campos (colegio + curso) --------------- */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:960px){
  .grid4{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .grid4{grid-template-columns:1fr}
}
.curso-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:var(--primary-soft);color:var(--primary);margin-left:6px;vertical-align:1px}
.seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

.obs-dot{display:block;font-size:10.5px;font-weight:600;color:var(--accent);letter-spacing:.02em}

</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="mark" aria-hidden="true">R</span>
      <div>Reforzamiento<small>Asistencia y evaluación</small></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button class="tab" role="tab" data-view="registrar" aria-selected="true"><span class="ic" aria-hidden="true">✎</span>Registrar</button>
      <button class="tab" role="tab" data-view="panel"><span class="ic" aria-hidden="true">▤</span>Panel</button>
      <button class="tab" role="tab" data-view="estudiantes"><span class="ic" aria-hidden="true">☺</span>Estudiantes</button>
      <button class="tab" role="tab" data-view="informes"><span class="ic" aria-hidden="true">⇩</span>Informes</button>

<script>
/* ============================================================
   xlsx-lite.js
   Generador mínimo de archivos .xlsx (OOXML) sin dependencias.
   Funciona en el navegador y en Node. ZIP con método "stored".

   Uso:
     const wb = XLSX.create();
     const ws = wb.addSheet('Resumen');
     ws.widths([30, 12, 12]);
     ws.merge('A1', 'C1');
     ws.push(['Título'], 'title');
     ws.set(2, 0, new Date(2026, 10, 7), 'date');
     ws.freeze(1, 0);
     const bytes = wb.build();       // Uint8Array
   ============================================================ */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  root.XLSX = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ---------------- ZIP (stored, sin compresión) --------------- */
  const CRC_TABLE = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  const enc = new TextEncoder();

  function zip(files) {
    // files: [{ name, data: Uint8Array }]
    const chunks = [];
    const central = [];
    let offset = 0;
    const DOS_TIME = 0x6000; // 12:00:00
    const DOS_DATE = ((2026 - 1980) << 9) | (1 << 5) | 1; // 2026-01-01

    for (const f of files) {
      const nameBytes = enc.encode(f.name);
      const crc = crc32(f.data);
      const size = f.data.length;

      const lh = new Uint8Array(30 + nameBytes.length);
      const dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);       // versión necesaria
      dv.setUint16(6, 0x0800, true);   // flag: nombres en UTF-8
      dv.setUint16(8, 0, true);        // método: stored
      dv.setUint16(10, DOS_TIME, true);
      dv.setUint16(12, DOS_DATE, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, size, true);
      dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);

      chunks.push(lh, f.data);

      const cd = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, DOS_TIME, true);
      cv.setUint16(14, DOS_DATE, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      cd.set(nameBytes, 46);
      central.push(cd);

      offset += lh.length + size;
    }

    const centralSize = central.reduce((a, c) => a + c.length, 0);
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);

    const total = offset + centralSize + 22;
    const out = new Uint8Array(total);
    let p = 0;
    for (const c of chunks) { out.set(c, p); p += c.length; }
    for (const c of central) { out.set(c, p); p += c.length; }
    out.set(eocd, p);
    return out;
  }

  /* ------------------------- Utilidades ------------------------ */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  }

  function colName(n) { // 0 -> A
    let s = '';
    n = n + 1;
    while (n > 0) {
      const r = (n - 1) % 26;
      s = String.fromCharCode(65 + r) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function cellRef(r, c) { return colName(c) + (r + 1); }

  function dateSerial(d) {
    const utc = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
    return Math.round((utc - Date.UTC(1899, 11, 30)) / 86400000);
  }

  /* ------------------------- Estilos --------------------------- */
  // numFmtId: 0 general | 164 fecha dd-mm-yyyy | 165 dd-mm-yy | 166 0.0
  const STYLES = {
    default:  { font: 0, fill: 0, border: 0, fmt: 0,  align: 0 },
    title:    { font: 1, fill: 0, border: 0, fmt: 0,  align: 1 },
    h1:       { font: 2, fill: 2, border: 1, fmt: 0,  align: 2 },
    h2:       { font: 3, fill: 3, border: 1, fmt: 0,  align: 2 },
    label:    { font: 3, fill: 0, border: 0, fmt: 0,  align: 1 },
    text:     { font: 0, fill: 0, border: 1, fmt: 0,  align: 1 },
    wrap:     { font: 0, fill: 0, border: 1, fmt: 0,  align: 3 },
    center:   { font: 0, fill: 0, border: 1, fmt: 0,  align: 2 },
    date:     { font: 0, fill: 0, border: 1, fmt: 164, align: 2 },
    num:      { font: 0, fill: 0, border: 1, fmt: 166, align: 2 },
    int:      { font: 0, fill: 0, border: 1, fmt: 1,  align: 2 },
    pct:      { font: 0, fill: 0, border: 1, fmt: 10, align: 2 },
    absent:   { font: 4, fill: 4, border: 1, fmt: 0,  align: 2 },
    present:  { font: 5, fill: 5, border: 1, fmt: 0,  align: 2 },
    note:     { font: 6, fill: 0, border: 0, fmt: 0,  align: 3 },
    total:    { font: 3, fill: 3, border: 1, fmt: 0,  align: 1 },
  };
  const STYLE_KEYS = Object.keys(STYLES);

  function stylesXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<numFmts count="3">' +
        '<numFmt numFmtId="164" formatCode="dd-mm-yyyy"/>' +
        '<numFmt numFmtId="165" formatCode="dd-mm-yy"/>' +
        '<numFmt numFmtId="166" formatCode="0.0"/>' +
      '</numFmts>' +
      '<fonts count="7">' +
        '<font><sz val="10"/><name val="Calibri"/><family val="2"/></font>' +
        '<font><b/><sz val="14"/><color rgb="FF1F3B57"/><name val="Calibri"/><family val="2"/></font>' +
        '<font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font>' +
        '<font><b/><sz val="10"/><color rgb="FF1F3B57"/><name val="Calibri"/><family val="2"/></font>' +
        '<font><sz val="10"/><color rgb="FFB42318"/><name val="Calibri"/><family val="2"/></font>' +
        '<font><sz val="10"/><color rgb="FF12715B"/><name val="Calibri"/><family val="2"/></font>' +
        '<font><i/><sz val="9"/><color rgb="FF6B7280"/><name val="Calibri"/><family val="2"/></font>' +
      '</fonts>' +
      '<fills count="6">' +
        '<fill><patternFill patternType="none"/></fill>' +
        '<fill><patternFill patternType="gray125"/></fill>' +
        '<fill><patternFill patternType="solid"><fgColor rgb="FF1F3B57"/><bgColor indexed="64"/></patternFill></fill>' +
        '<fill><patternFill patternType="solid"><fgColor rgb="FFE8EEF5"/><bgColor indexed="64"/></patternFill></fill>' +
        '<fill><patternFill patternType="solid"><fgColor rgb="FFFDE7E4"/><bgColor indexed="64"/></patternFill></fill>' +
        '<fill><patternFill patternType="solid"><fgColor rgb="FFE4F3EC"/><bgColor indexed="64"/></patternFill></fill>' +
      '</fills>' +
      '<borders count="2">' +
        '<border><left/><right/><top/><bottom/><diagonal/></border>' +
        '<border><left style="thin"><color rgb="FFD5DCE4"/></left><right style="thin"><color rgb="FFD5DCE4"/></right>' +
        '<top style="thin"><color rgb="FFD5DCE4"/></top><bottom style="thin"><color rgb="FFD5DCE4"/></bottom><diagonal/></border>' +
      '</borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="' + STYLE_KEYS.length + '">' +
        STYLE_KEYS.map(function (k) {
          const s = STYLES[k];
          return '<xf numFmtId="' + s.fmt + '" fontId="' + s.font + '" fillId="' + s.fill + '" borderId="' + s.border + '" xfId="0"' +
            (s.fmt ? ' applyNumberFormat="1"' : '') +
            (s.font ? ' applyFont="1"' : '') +
            (s.fill ? ' applyFill="1"' : '') +
            (s.border ? ' applyBorder="1"' : '') +
            ' applyAlignment="1">' +
            ['', '<alignment vertical="center"/>', '<alignment horizontal="center" vertical="center" wrapText="1"/>',
             '<alignment vertical="top" wrapText="1"/>'][s.align] +
            '</xf>';
        }).join('') +
      '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';
  }

  /* -------------------------- Hoja ----------------------------- */
  function Sheet(name, index) {
    this.name = name;
    this.index = index;
    this.cells = {};       // "r,c" -> {v, s, t}
    this.maxR = -1;
    this.maxC = -1;
    this.colWidths = {};
    this.freezeRow = 0;
    this.freezeCol = 0;
    this.filterRef = null;
    this.merges = [];
    this.rowHeights = {};
  }

  Sheet.prototype.set = function (r, c, v, style) {
    if (v === null || v === undefined || v === '') {
      if (!style) { return this; }
    }
    this.cells[r + ',' + c] = { v: v, s: style || 'default' };
    if (r > this.maxR) this.maxR = r;
    if (c > this.maxC) this.maxC = c;
    return this;
  };

  Sheet.prototype.push = function (values, style) {
    const r = this.maxR + 1;
    for (let c = 0; c < values.length; c++) this.set(r, c, values[c], style);
    if (values.length === 0) { this.maxR = r; }
    return r;
  };

  Sheet.prototype.blank = function (n) {
    this.maxR += (n === undefined ? 1 : n);
    return this;
  };

  Sheet.prototype.widths = function (arr) {
    for (let i = 0; i < arr.length; i++) this.colWidths[i] = arr[i];
    return this;
  };

  Sheet.prototype.freeze = function (row, col) {
    this.freezeRow = row || 0;
    this.freezeCol = col || 0;
    return this;
  };

  Sheet.prototype.autofilter = function (r1, c1, r2, c2) {
    this.filterRef = cellRef(r1, c1) + ':' + cellRef(r2, c2);
    return this;
  };

  Sheet.prototype.merge = function (r1, c1, r2, c2) {
    this.merges.push(cellRef(r1, c1) + ':' + cellRef(r2, c2));
    if (r2 > this.maxR) this.maxR = r2;
    if (c2 > this.maxC) this.maxC = c2;
    return this;
  };

  Sheet.prototype.rowHeight = function (r, h) { this.rowHeights[r] = h; return this; };

  Sheet.prototype.toXml = function () {
    const self = this;
    const ref = this.maxR < 0 ? 'A1' : cellRef(0, 0) + ':' + cellRef(this.maxR, this.maxC);
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    x += '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
    x += '<dimension ref="' + ref + '"/>';

    const pane = (this.freezeRow || this.freezeCol) ? (function () {
      const tl = cellRef(self.freezeRow, self.freezeCol);
      const active = self.freezeRow && self.freezeCol ? 'bottomRight' : (self.freezeRow ? 'bottomLeft' : 'topRight');
      return '<pane xSplit="' + (self.freezeCol || 0) + '" ySplit="' + (self.freezeRow || 0) + '" topLeftCell="' + tl + '" activePane="' + active + '" state="frozen"/>' +
        '<selection pane="' + active + '" activeCell="' + tl + '" sqref="' + tl + '"/>';
    })() : '<selection activeCell="A1" sqref="A1"/>';
    x += '<sheetViews><sheetView tabSelected="' + (this.index === 0 ? 1 : 0) + '" workbookViewId="0">' + pane + '</sheetView></sheetViews>';
    x += '<sheetFormatPr defaultRowHeight="15"/>';

    const cw = Object.keys(this.colWidths);
    if (cw.length) {
      x += '<cols>';
      cw.sort(function (a, b) { return a - b; }).forEach(function (k) {
        x += '<col min="' + (+k + 1) + '" max="' + (+k + 1) + '" width="' + self.colWidths[k] + '" customWidth="1"/>';
      });
      x += '</cols>';
    }

    x += '<sheetData>';
    const rows = {};
    Object.keys(this.cells).forEach(function (k) {
      const p = k.split(',');
      const r = +p[0];
      if (!rows[r]) rows[r] = [];
      rows[r].push({ r: r, c: +p[1], cell: self.cells[k] });
    });
    Object.keys(rows).map(Number).sort(function (a, b) { return a - b; }).forEach(function (r) {
      const rh = self.rowHeights[r];
      x += '<row r="' + (r + 1) + '"' + (rh ? ' ht="' + rh + '" customHeight="1"' : '') + '>';
      rows[r].sort(function (a, b) { return a.c - b.c; }).forEach(function (item) {
        const v = item.cell.v;
        const s = STYLE_KEYS.indexOf(item.cell.s);
        const sAttr = s > 0 ? ' s="' + s + '"' : '';
        if (v === null || v === undefined || v === '') {
          x += '<c r="' + cellRef(r, item.c) + '"' + sAttr + '/>';
        } else if (typeof v === 'number' && isFinite(v)) {
          x += '<c r="' + cellRef(r, item.c) + '"' + sAttr + '><v>' + v + '</v></c>';
        } else if (typeof v === 'boolean') {
          x += '<c r="' + cellRef(r, item.c) + '"' + sAttr + ' t="b"><v>' + (v ? 1 : 0) + '</v></c>';
        } else if (v instanceof Date) {
          x += '<c r="' + cellRef(r, item.c) + '"' + sAttr + '><v>' + dateSerial(v) + '</v></c>';
        } else {
          x += '<c r="' + cellRef(r, item.c) + '"' + sAttr + ' t="inlineStr"><is><t xml:space="preserve">' + esc(v) + '</t></is></c>';
        }
      });
      x += '</row>';
    });
    x += '</sheetData>';

    if (this.filterRef) x += '<autoFilter ref="' + this.filterRef + '"/>';
    if (this.merges.length) {
      x += '<mergeCells count="' + this.merges.length + '">';
      this.merges.forEach(function (m) { x += '<mergeCell ref="' + m + '"/>'; });
      x += '</mergeCells>';
    }
    x += '</worksheet>';
    return x;
  };

  /* ------------------------ Libro ------------------------------ */
  function Workbook() { this.sheets = []; }

  Workbook.prototype.addSheet = function (name) {
    const clean = String(name).replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31) || ('Hoja' + (this.sheets.length + 1));
    const s = new Sheet(clean, this.sheets.length);
    this.sheets.push(s);
    return s;
  };

  Workbook.prototype.build = function () {
    const files = [];
    const n = this.sheets.length;

    let ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    ct += '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">';
    ct += '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>';
    ct += '<Default Extension="xml" ContentType="application/xml"/>';
    ct += '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
    ct += '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';
    for (let i = 0; i < n; i++) {
      ct += '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    }
    ct += '</Types>';

    const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';

    let wbXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    wbXml += '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
    wbXml += '<bookViews><workbookView xWindow="0" yWindow="0" windowWidth="20000" windowHeight="12000"/></bookViews>';
    wbXml += '<sheets>';
    for (let i = 0; i < n; i++) {
      wbXml += '<sheet name="' + esc(this.sheets[i].name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
    }
    wbXml += '</sheets><calcPr calcId="191029"/></workbook>';

    let wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    wbRels += '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
    for (let i = 0; i < n; i++) {
      wbRels += '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
    }
    wbRels += '<Relationship Id="rId' + (n + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
    wbRels += '</Relationships>';

    files.push({ name: '[Content_Types].xml', data: enc.encode(ct) });
    files.push({ name: '_rels/.rels', data: enc.encode(rels) });
    files.push({ name: 'xl/workbook.xml', data: enc.encode(wbXml) });
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: enc.encode(wbRels) });
    files.push({ name: 'xl/styles.xml', data: enc.encode(stylesXml()) });
    for (let i = 0; i < n; i++) {
      files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: enc.encode(this.sheets[i].toXml()) });
    }
    return zip(files);
  };

  return { create: function () { return new Workbook(); }, colName: colName, dateSerial: dateSerial, _zip: zip };
});


/* ============================================================

(function (root, factory) {

  const ASIGNACIONES = [
    { colegioId: 'c1', profesorId: 'p2' }, { colegioId: 'c1', profesorId: 'p4' },

              if (regs[i].r.observacion && regs[i].r.observacion.trim()) return regs[i].r.observacion;

            return '';

    return out.sort(function (a, b) { return b.peso - a.peso; });

  /* ----------------------- Observaciones ----------------------- */
  function observaciones(db, opts) {
    opts = opts || {};
    const f = filtrar(db, opts);
    const out = [];
    f.registros.forEach(function (r) {
      if (!r.observacion || !r.observacion.trim()) return;
      if (opts.etiqueta && (r.etiquetas || []).indexOf(opts.etiqueta) < 0) return;
      if (opts.estudianteId && r.estudianteId !== opts.estudianteId) return;
      const s = f.sesiones.find(function (x) { return x.id === r.sesionId; });
      out.push({
        fecha: s ? s.fecha : '', sesion: s,
        estudiante: estudiante(db, r.estudianteId),
        colegio: s ? colegio(db, s.colegioId) : null,
        curso: s ? curso(db, s.cursoId) : null,
        profesor: s ? profesor(db, s.profesorId) : null,
        evaluacion: r.evaluacion, asistencia: r.asistencia,
        observacion: r.observacion, etiquetas: r.etiquetas || [],

    });
    return out.sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
  }

  /* ------------------------ Validación ------------------------- */
  /**
   * Asistencia y evaluación son obligatorias en todas las filas.
   * La evaluación admite 0, y 0 significa "sin nota": es un valor válido,
   * no un dato faltante.
   */
  function validarRegistro(payload) {
    const errores = [];
    const filas = payload.filas || [];
    if (!payload.fecha) errores.push('Falta la fecha de la clase.');
    if (!payload.colegioId) errores.push('Falta seleccionar el colegio.');
    if (!payload.cursoId) errores.push('Falta seleccionar el curso.');
    if (!payload.profesorId) errores.push('Falta seleccionar el profesor.');
    if (payload.realizada !== false) {
      if (!filas.length) errores.push('El curso no tiene estudiantes.');
      filas.forEach(function (f) {
        if (!f.asistencia) errores.push(f.nombre + ': falta marcar la asistencia.');
        if (f.evaluacion === null || f.evaluacion === undefined || f.evaluacion === '' ||
          isNaN(Number(f.evaluacion)) || Number(f.evaluacion) < 0 || Number(f.evaluacion) > 3) {
          errores.push(f.nombre + ': falta la evaluación (0 = sin nota).');
        }
      });
    } else if (!payload.motivo || !payload.motivo.trim()) {
      errores.push('Si la clase no se realizó, indica el motivo.');
    }
    return errores;
  }

  /**
   * Guarda (crea o actualiza) la clase de un curso en una fecha.
   * Una sola clase por curso y fecha: evita duplicar la información.
   */
  function guardarSesion(db, payload) {
    const fecha = payload.fecha;
    let sesion = sesionDe(db, payload.cursoId, fecha);
    const ahora = ahoraLocal();
    let nuevo = false;

    if (!sesion) {
      nuevo = true;
      sesion = {
        id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        fecha: fecha,
        colegioId: payload.colegioId,
        cursoId: payload.cursoId,
        profesorId: payload.profesorId,
        realizada: payload.realizada !== false,
        motivo: payload.motivo || '',
        registradoPor: payload.profesorId,
        creadoEn: ahora,
        actualizadoEn: ahora,
      };
      db.sesiones.push(sesion);
    } else {
      sesion.colegioId = payload.colegioId;
      sesion.profesorId = payload.profesorId;
      sesion.realizada = payload.realizada !== false;
      sesion.motivo = payload.motivo || '';
      sesion.actualizadoEn = ahora;
    }

    let creados = 0, actualizados = 0;
    if (sesion.realizada) {
      (payload.filas || []).forEach(function (f) {
        const ex = registroDe(db, sesion.id, f.estudianteId);
        const valor = {
          asistencia: f.asistencia,
          evaluacion: Number(f.evaluacion),
          observacion: (f.observacion || '').trim(),
          etiquetas: f.etiquetas || [],
          actualizadoEn: ahora,
        };
        if (ex) {
          const cambia = ex.asistencia !== valor.asistencia || ex.evaluacion !== valor.evaluacion ||
            ex.observacion !== valor.observacion ||
            JSON.stringify(ex.etiquetas || []) !== JSON.stringify(valor.etiquetas || []);
          Object.assign(ex, valor);
          if (cambia) actualizados++;
        } else {
          db.registros.push(Object.assign({
            id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            sesionId: sesion.id,
            estudianteId: f.estudianteId,
            creadoEn: ahora,
          }, valor));
          creados++;
        }
      });
    } else {
      db.registros = db.registros.filter(function (r) { return r.sesionId !== sesion.id; });
    }
    return { sesion: sesion, nuevo: nuevo, creados: creados, actualizados: actualizados };
  }

  /* ------------------- Resumen narrativo ----------------------- */
  function borradorInforme(db, opts) {
    const k = indicadores(db, opts);
    const cols = porColegio(db, opts);
    const curs = porCurso(db, opts);
    const profs = porProfesor(db, opts);
    const obs = observaciones(db, opts);
    const als = alertas(db, opts);
    const nombreColegio = opts.colegioId ? (colegio(db, opts.colegioId) || {}).nombre : 'todos los colegios';
    const L = [];

    L.push('INFORME DE REFORZAMIENTO — ' + (nombreColegio || '').toUpperCase());
    L.push('Periodo: ' + fmtFecha(opts.desde) + ' al ' + fmtFecha(opts.hasta));
    L.push('');
    L.push('1. Cobertura');
    L.push('Durante el periodo se realizaron ' + k.sesiones + ' sesiones de reforzamiento en ' +
      cols.length + ' establecimiento(s) y ' + curs.length + ' curso(s), con ' + k.estudiantes +
      ' estudiantes participantes y ' + k.registros + ' registros de asistencia.');
    L.push('');
    L.push('2. Asistencia');
    L.push('La asistencia global fue de ' + pct(k.asistencia) + ' (' + k.presentes + ' presencias de ' +
      k.registros + ' registros).');
    L.push(curs.map(function (c) {
      return '· ' + c.colegio.nombre + ' — ' + c.curso.nombre + ': ' + pct(c.asistencia) +
        ' (' + c.estudiantes + ' estudiantes, ' + c.sesiones + ' sesiones)';
    }).join('\n'));
    L.push('');
    L.push('3. Evaluación');
    if (k.promedio !== null) {
      L.push('El promedio de los niveles 1 a 3 fue ' + num(k.promedio, 2) + '. Se calcula solo con las ' +
        k.conNota + ' evaluaciones con nota; los otros ' + k.sinNota + ' registros (' +
        pct(k.registros ? k.sinNota / k.registros : 0) + ') quedaron en 0, que significa sin nota.');
      L.push('Distribución: 0 sin nota: ' + k.distribucion[0] + '; 1: ' + k.distribucion[1] +
        '; 2: ' + k.distribucion[2] + '; 3: ' + k.distribucion[3] + '.');
      if (k.conNota) {
        L.push('El ' + pct((k.distribucion[2] + k.distribucion[3]) / k.conNota) +
          ' de las evaluaciones con nota se ubicó en los niveles 2 y 3.');
      }
    } else {
      L.push('No se registraron evaluaciones con nota en el periodo (todos los registros quedaron en 0).');
    }
    L.push('');
    L.push('4. Equipo docente');
    L.push(profs.map(function (p) {
      return p.profesor.nombre + ': ' + p.sesiones + ' sesiones, asistencia ' + pct(p.asistencia);
    }).join('; ') + '.');
    L.push('');
    L.push('5. Observaciones cualitativas (' + obs.length + ')');
    if (obs.length) {
      obs.slice(0, 25).forEach(function (o) {
        L.push('· ' + fmtFecha(o.fecha) + ' — ' + (o.estudiante ? o.estudiante.nombre : '') +
          ' (' + (o.colegio ? o.colegio.nombre : '') + (o.curso ? ' · ' + o.curso.nombre : '') + '): "' +
          o.observacion + '"' + (o.etiquetas.length ? ' [' + o.etiquetas.join(', ') + ']' : ''));
      });
      if (obs.length > 25) L.push('(se listan las 25 más recientes de ' + obs.length + ' observaciones)');
    } else {
      L.push('Sin observaciones registradas en el periodo.');
    }
    L.push('');
    L.push('6. Estudiantes que requieren seguimiento (' + als.length + ')');
    if (als.length) {
      als.slice(0, 12).forEach(function (a) {
        L.push('· ' + a.estudiante.nombre + ' (' + a.colegio.nombre + ' · ' + a.curso.nombre + '): ' +
          a.motivos.map(function (m) { return m.texto; }).join('; ') + '.');
      });
    } else {
      L.push('No se detectaron señales de alerta con los criterios actuales.');
    }
    L.push('');
    L.push('Documento generado automáticamente desde los registros del sistema el ' + fmtFecha(new Date()) + '.');
    return L.join('\n');
  }

  function pct(x) {
    if (x === null || x === undefined || isNaN(x)) return 's/d';
    return (x * 100).toFixed(1).replace('.', ',') + '%';
  }
  function num(x, d) {
    if (x === null || x === undefined || isNaN(x)) return 's/d';
    return x.toFixed(d === undefined ? 2 : d).replace('.', ',');
  }

  return {

    startOfWeek: startOfWeek, diasDesde: diasDesde,

    cursosDeColegio: cursosDeColegio, cursosDeProfesor: cursosDeProfesor,
    profesoresDeColegio: profesoresDeColegio, estaAsignado: estaAsignado,
    colegiosDeProfesor: colegiosDeProfesor,
    estudiantesDeCurso: estudiantesDeCurso, estudiantesDeColegio: estudiantesDeColegio,
    sesionDe: sesionDe, registrosDeSesion: registrosDeSesion, registroDe: registroDe,
    filtrar: filtrar, indicadores: indicadores, porColegio: porColegio, porCurso: porCurso,
    porProfesor: porProfesor, serieSemanal: serieSemanal,
    alertas: alertas, observaciones: observaciones,
    validarRegistro: validarRegistro, guardarSesion: guardarSesion,
    borradorInforme: borradorInforme, pct: pct, num: num,
  };
});


/* ============================================================
   report.js — Informe Excel.
     · Resumen          indicadores generales, por colegio y por curso
     · <un colegio>     una hoja por colegio, con un bloque por curso
     · Registro         base plana (una fila por estudiante y clase)
     · Observaciones    texto cualitativo filtrable
     · Estudiantes      nómina por curso
     · Diccionario      qué significa cada código y cómo recalcular

   Escala: 0 = sin nota; 1, 2 y 3 = niveles de logro.
   ============================================================ */
(function (root, factory) {

  'use strict';

  function construir(db, opts) {
    opts = opts || {};

    [
      ['Sesiones realizadas', k.sesiones, 'int'],

      ['Estudiantes participantes', k.estudiantes, 'int'],
      ['Registros de asistencia', k.registros, 'int'],
      ['Asistencia promedio', k.asistencia, 'pct'],
      ['Evaluación promedio (niveles 1-3)', k.promedio, 'num'],
      ['Registros con nota', k.conNota, 'int'],
      ['Registros sin nota (0)', k.sinNota, 'int'],
      ['Niveles 2 y 3 sobre las notas', k.conNota ? (k.distribucion[2] + k.distribucion[3]) / k.conNota : null, 'pct'],
      ['Registros con observación', k.observaciones, 'int'],
    ].forEach(function (x) {

    ['Profesor', 'Sesiones', 'Registros', 'Asistencia', 'Prom. 1-3'].forEach(function (h, i) { rs.set(r, i, h, 'h1'); });
    r++;
    profs.forEach(function (p) {

    rg.merge(rr + 1, 0, rr + 1, 8);

    /* ----------------------- Observaciones -------------------------- */
    const os = wb.addSheet('Observaciones');
    os.widths([11, 30, 16, 28, 20, 11, 11, 22, 66]);
    os.merge(0, 0, 0, 8);
    os.set(0, 0, 'Observaciones registradas (' + obs.length + ')', 'title');
    os.merge(1, 0, 1, 8);
    os.set(1, 0, 'Texto libre escrito por el profesorado. Sirve para el análisis cualitativo del informe.', 'note');
    ['Fecha', 'Colegio', 'Curso', 'Estudiante', 'Profesor', 'Asist.', 'Eval.', 'Etiqueta', 'Observación']
      .forEach(function (h, i) { os.set(3, i, h, 'h1'); });
    let oo = 4;
    obs.forEach(function (o) {
      os.set(oo, 0, L.parseISO(o.fecha), 'date');
      os.set(oo, 1, o.colegio ? o.colegio.nombre : '', 'text');
      os.set(oo, 2, o.curso ? o.curso.nombre : '', 'text');
      os.set(oo, 3, o.estudiante ? o.estudiante.nombre : '', 'text');
      os.set(oo, 4, o.profesor ? o.profesor.nombre : '', 'text');
      os.set(oo, 5, o.asistencia, o.asistencia === 'P' ? 'present' : 'absent');
      os.set(oo, 6, o.evaluacion, 'int');
      os.set(oo, 7, o.etiquetas.join(', '), 'text');
      os.set(oo, 8, o.observacion, 'wrap');
      oo++;
    });
    os.freeze(4, 0);
    os.autofilter(3, 0, Math.max(3, oo - 1), 8);

    /* ------------------------- Estudiantes -------------------------- */
    const es = wb.addSheet('Estudiantes');
    es.widths([30, 28, 16, 12, 12, 9]);
    es.merge(0, 0, 0, 5);
    es.set(0, 0, 'Nómina de estudiantes', 'title');
    es.merge(1, 0, 1, 5);
    es.set(1, 0, 'Lista vigente por curso. Un estudiante deja de aparecer cuando se quita de la lista.', 'note');
    ['Colegio', 'Estudiante', 'Curso', 'Asistencia', 'Prom. 1-3', 'N obs.']
      .forEach(function (h, i) { es.set(3, i, h, 'h1'); });
    let ee = 4;
    (db.estudiantes || []).slice().sort(function (a, b) {
      return a.colegioId === b.colegioId ? L.cmpNombre(a, b) : a.colegioId.localeCompare(b.colegioId);
    }).forEach(function (est) {
      const col = L.colegio(db, est.colegioId);
      const cur = L.curso(db, est.cursoId);
      const regs = k.registrosLista.filter(function (x) { return x.estudianteId === est.id; });
      const pres = regs.filter(function (x) { return x.asistencia === 'P'; }).length;
      const evs = regs.filter(function (x) { return typeof x.evaluacion === 'number' && x.evaluacion >= 1; });
      es.set(ee, 0, col ? col.nombre : '', 'text');
      es.set(ee, 1, est.nombre, 'text');
      es.set(ee, 2, cur ? cur.nombre : '', 'text');
      es.set(ee, 3, regs.length ? pres / regs.length : null, 'pct');
      es.set(ee, 4, evs.length ? evs.reduce(function (a, x) { return a + x.evaluacion; }, 0) / evs.length : null, 'num');
      es.set(ee, 5, regs.filter(function (x) { return x.observacion && x.observacion.trim(); }).length, 'int');
      ee++;
    });
    es.freeze(4, 0);
    es.autofilter(3, 0, Math.max(3, ee - 1), 5);

    /* ------------------------- Diccionario -------------------------- */
    const ds = wb.addSheet('Diccionario');
    ds.widths([28, 108]);
    ds.merge(0, 0, 0, 1);
    ds.set(0, 0, 'Cómo leer y usar este archivo', 'title');
    const filasDoc = [
      ['Este archivo lo genera el sistema', 'Se regenera completo cada vez que se descarga: no conviene escribir a mano dentro de él, porque el próximo no incluirá esos cambios. Para trabajar con datos propios, copia una hoja a un archivo nuevo.'],
      ['Unidad de registro', 'La clase. Cada curso tiene sus propias clases: dos cursos del mismo colegio pueden tener fechas distintas y por eso aparecen en bloques separados dentro de la hoja del colegio.'],
      ['Asistencia', 'P = presente; A = ausente.'],
      ['Evaluación', 'Se registra siempre, en una escala de 0 a 3. El 0 significa SIN NOTA (no hubo evaluación: por ejemplo, el estudiante faltó). Los valores 1, 2 y 3 son los niveles de logro que el equipo define en sus reuniones semanales.'],
      ['Promedio', 'Se calcula solo con los niveles 1, 2 y 3. Los registros en 0 no entran en el promedio, porque no son una nota; se informan aparte en la columna "Sin nota".'],
      ['Hojas por colegio', 'Cada colegio tiene su hoja, con un bloque por curso: estudiantes en filas, clases en columnas y el resumen a la derecha de cada bloque.'],
      ['Hoja Registro', 'Una fila por estudiante y por clase, con la columna Curso y el valor de evaluación tal como se registró. Es la hoja para tablas dinámicas y cruces.'],
      ['Hoja Observaciones', 'Todo el texto cualitativo, con fecha, colegio, curso y etiqueta, para citar en el informe.'],
      ['Clases no realizadas', 'Si una clase se suspendió (feriado, licencia, actividad del colegio) no se marca a nadie como ausente: la clase no entra en los cálculos.'],
      ['Actualización', 'Los datos se pueden exportar en cualquier momento: el archivo siempre refleja lo último guardado.'],
    ];
    filasDoc.forEach(function (f, i) {
      ds.set(2 + i, 0, f[0], 'label');
      ds.set(2 + i, 1, f[1], 'wrap');
      ds.rowHeight(2 + i, 32);
    });

    return wb;
  }

  return { construir: construir };
});


/* ============================================================
   app.js — Interfaz del sistema de reforzamiento.
   Sin dependencias ni servidor: funciona con doble clic.
   Pensada primero para celular.

   Evaluación: 0-3. El 0 significa SIN NOTA y es un valor válido.
   Se registra siempre, para presentes y ausentes.
   ============================================================ */
(function () {
  'use strict';

  const LOGIC = window.LOGIC, DEMO = window.DEMO, REPORT = window.REPORT, XLSX = window.XLSX;

  /* ------------------------- Utilidades ------------------------ */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hoyISO = () => LOGIC.iso(new Date());
  const pct = LOGIC.pct;

  function toast(msg, tipo) {
    const t = $('#toast');
    t.innerHTML = '<div class="toast-in ' + (tipo || '') + '">' + (tipo === 'ok' ? '✓ ' : tipo === 'err' ? '⚠ ' : '') + esc(msg) + '</div>';
    t.classList.add('on');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('on'), tipo === 'err' ? 5200 : 3000);
  }

  /* --------------------------- Almacén ------------------------- */
  const LS_KEY = 'reforzamiento.v4';
  let DB;

  /** Algunos navegadores no dejan guardar nada al abrir un archivo local. */
  const ALMACEN_OK = (function () {
    try { localStorage.setItem('__prueba', '1'); localStorage.removeItem('__prueba'); return true; }
    catch (e) { return false; }
  })();

  /** Normaliza datos de versiones anteriores. */
  function migrar(d) {
    if (!d) return d;
    if (!d.cursos || !d.cursos.length) {
      d.cursos = [];
      (d.colegios || []).forEach(function (c) {
        d.cursos.push({ id: 'k-' + c.id, colegioId: c.id, nombre: c.curso || 'Curso' });
      });
    }
    (d.estudiantes || []).forEach(function (e) {
      if (!e.cursoId) {
        const k = d.cursos.find(function (x) { return x.colegioId === e.colegioId; });
        e.cursoId = k ? k.id : '';
      }
    });
    (d.sesiones || []).forEach(function (s) {
      if (!s.cursoId) {
        const k = d.cursos.find(function (x) { return x.colegioId === s.colegioId; });
        s.cursoId = k ? k.id : '';
      }
    });
    // En el modelo actual la evaluación siempre existe: 0 = sin nota.
    (d.registros || []).forEach(function (r) {
      if (typeof r.evaluacion !== 'number') r.evaluacion = 0;
    });
    d.ajustes = Object.assign({ modoRapido: true, diasEdicion: 30 }, d.ajustes || {});
    delete d.ajustes.leyenda;
    d.version = 3;
    return d;
  }

  function cargarDB() {
    try {
      const raw = localStorage.getItem(LS_KEY) || localStorage.getItem('reforzamiento.v3');
      if (raw) {
        const d = JSON.parse(raw);
        if (d && d.colegios && d.estudiantes) return migrar(d);
      }
    } catch (e) { /* almacenamiento no disponible */ }
    return DEMO.buildDemoDB(new Date());
  }
  function guardarDB() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
    catch (e) { toast('No se pudo guardar en este navegador. Descarga un respaldo en Ajustes.', 'err'); }
  }

  DB = cargarDB();

  /* ---------------------------- Estado ------------------------- */
  const S = {
    fecha: hoyISO(), colegioId: '', cursoId: '', profesorId: '',
    realizada: true, motivo: '', filas: {}, obsAbierta: {},
    busqueda: '', intentado: false, editando: null, ultimo: null, modoLider: false,
  };
  const V = {
    vista: 'registrar',
    panel: { rango: '30', colegio: '', curso: '' },
    info: { rango: '30', colegio: '', curso: '', etiqueta: '' },
    estu: { colegio: '', curso: '' },
  };

  function rangoFechas(r) {
    const hoy = new Date();
    const hasta = LOGIC.iso(hoy);
    if (r === 'mes') {
      const p = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
      return { desde: LOGIC.iso(p), hasta: hasta };
    }
    if (r === 'todo') return { desde: '2000-01-01', hasta: hasta };
    const dias = parseInt(r, 10) || 30;
    return { desde: LOGIC.iso(LOGIC.addDays(hoy, -(dias - 1))), hasta: hasta };
  }

  /* ----------------------------- Navegación -------------------- */
  function ir(vista) {
    V.vista = vista;
    $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === vista)));
    $$('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + vista));
    if (vista === 'registrar') renderRegistrar();
    if (vista === 'panel') renderPanel();
    if (vista === 'estudiantes') renderEstudiantes();
    if (vista === 'informes') renderInformes();
    if (vista === 'ajustes') renderAjustes();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ================================================================
     VISTA 1 · REGISTRAR CLASE
     ================================================================ */
  function opcionesColegio() {
    return DB.colegios.map(c =>
      '<option value="' + c.id + '"' + (c.id === S.colegioId ? ' selected' : '') + '>' + esc(c.nombre) + '</option>').join('');
  }

  function opcionesCurso() {
    const lista = LOGIC.cursosDeColegio(DB, S.colegioId);
    if (!lista.length) return '<option value="">Sin cursos registrados</option>';
    return lista.map(k =>
      '<option value="' + k.id + '"' + (k.id === S.cursoId ? ' selected' : '') + '>' + esc(k.nombre) + '</option>').join('');
  }

  function opcionesProfesor() {
    const asignados = LOGIC.profesoresDeColegio(DB, S.colegioId);
    const lista = asignados.slice();
    if (S.profesorId && !lista.some(p => p.id === S.profesorId)) {
      const p = LOGIC.profesor(DB, S.profesorId);
      if (p) lista.push(p);
    }
    if (!lista.length) return '<option value="">Sin profesores asignados</option>';
    return lista.map(p =>
      '<option value="' + p.id + '"' + (p.id === S.profesorId ? ' selected' : '') + '>' +
      esc(p.nombre) + (LOGIC.estaAsignado(DB, S.colegioId, p.id) ? '' : ' (no asignado)') + '</option>').join('');
  }

  function initSeleccion() {
    if (!DB.colegios.length) { S.colegioId = ''; S.cursoId = ''; return; }
    if (!S.colegioId || !LOGIC.colegio(DB, S.colegioId)) S.colegioId = DB.colegios[0].id;
    const cursos = LOGIC.cursosDeColegio(DB, S.colegioId);
    if (!S.cursoId || !cursos.some(k => k.id === S.cursoId)) S.cursoId = cursos.length ? cursos[0].id : '';
    const asig = LOGIC.profesoresDeColegio(DB, S.colegioId);
    if (!S.profesorId || !asig.some(p => p.id === S.profesorId)) S.profesorId = asig.length ? asig[0].id : (DB.profesores[0] || {}).id || '';
  }

  function cargarSesion() {
    const ests = LOGIC.estudiantesDeCurso(DB, S.cursoId);
    const ses = LOGIC.sesionDe(DB, S.cursoId, S.fecha);
    S.editando = ses;
    S.filas = {};
    S.obsAbierta = {};
    S.intentado = false;
    S.ultimo = null;
    S.modoLider = false;
    const rapido = DB.ajustes && DB.ajustes.modoRapido;
    ests.forEach(e => {
      const r = ses ? LOGIC.registroDe(DB, ses.id, e.id) : null;
      if (r) {
        S.filas[e.id] = {
          asistencia: r.asistencia,
          evaluacion: typeof r.evaluacion === 'number' ? r.evaluacion : 0,
          observacion: r.observacion || '', etiquetas: (r.etiquetas || []).slice(),
        };
        S.obsAbierta[e.id] = !!(r.observacion && r.observacion.trim());
      } else {
        S.filas[e.id] = { asistencia: rapido ? 'P' : '', evaluacion: null, observacion: '', etiquetas: [] };
      }
    });
    if (ses) {
      S.profesorId = ses.profesorId;
      S.realizada = ses.realizada;
      S.motivo = ses.motivo || '';
    }
  }

  function diasEdicion() { return (DB.ajustes && DB.ajustes.diasEdicion) || 30; }
  function fueraDePlazo() {
    if (!S.editando) return false;
    return LOGIC.diasDesde(S.editando.fecha) > diasEdicion();
  }

  function renderRegistrar() {
    initSeleccion();
    cargarSesion();
    const cont = $('#view-registrar');
    cont.innerHTML =
      '<div class="card">' +
        '<div class="card-head"><h2><span class="step">1</span>Datos de la clase</h2>' +
        '<span class="hint">Paso 1 de 2</span></div>' +
        '<div class="card-body">' +
          '<div class="grid4">' +
            '<div class="field"><label for="f-fecha">Fecha</label>' +
              '<input type="date" id="f-fecha" value="' + S.fecha + '">' +
              '<span class="hint">' + esc(LOGIC.fmtLarga(S.fecha)) + '</span></div>' +
            '<div class="field"><label for="f-col">Colegio</label>' +
              '<select id="f-col">' + opcionesColegio() + '</select>' +
              '<span class="hint">' + DB.colegios.length + ' establecimientos</span></div>' +
            '<div class="field"><label for="f-cur">Curso</label>' +
              '<select id="f-cur">' + opcionesCurso() + '</select>' +
              '<span class="hint">Define la lista del curso</span></div>' +
            '<div class="field"><label for="f-prof">Profesor</label>' +
              '<select id="f-prof">' + opcionesProfesor() + '</select>' +
              '<span class="hint">Quien dictó la clase</span></div>' +
          '</div>' +
          '<div id="ctx" style="margin-top:16px"></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2><span class="step">2</span>Asistencia y evaluación del curso</h2>' +
          '<label class="hint" style="margin-left:auto;display:flex;gap:8px;align-items:center;cursor:pointer">' +
            '<input type="checkbox" id="chk-susp" ' + (S.realizada ? '' : 'checked') + '> Clase no realizada' +
          '</label></div>' +
        '<div id="curso"></div>' +
      '</div>' +
      '<div class="footer-bar" id="cursofoot"></div>';

    $('#f-fecha').addEventListener('change', e => {
      if (!e.target.value) return;
      S.fecha = e.target.value;
      cargarSesion(); pintarCtx(); pintarCurso();
    });
    $('#f-col').addEventListener('change', e => {
      S.colegioId = e.target.value;
      const cursos = LOGIC.cursosDeColegio(DB, S.colegioId);
      S.cursoId = cursos.length ? cursos[0].id : '';
      const asig = LOGIC.profesoresDeColegio(DB, S.colegioId);
      S.profesorId = asig.length ? asig[0].id : S.profesorId;
      $('#f-cur').innerHTML = opcionesCurso();
      $('#f-prof').innerHTML = opcionesProfesor();
      cargarSesion(); pintarCtx(); pintarCurso();
    });
    $('#f-cur').addEventListener('change', e => {
      S.cursoId = e.target.value;
      cargarSesion(); pintarCtx(); pintarCurso();
    });
    $('#f-prof').addEventListener('change', e => {
      S.profesorId = e.target.value;
      pintarCtx();
    });
    $('#chk-susp').addEventListener('change', e => {
      S.realizada = !e.target.checked;
      pintarCurso();
    });
    $('#cursofoot').addEventListener('click', e => {
      const b = e.target.closest('[data-accion]');
      if (b && b.dataset.accion === 'enviar') enviar();
    });
    $('#ctx').addEventListener('click', e => {
      const b = e.target.closest('[data-accion]');
      if (!b) return;
      if (b.dataset.accion === 'lider') { S.modoLider = true; pintarCtx(); pintarFoot(); }
    });
    pintarCtx(); pintarCurso();
  }

  function pintarCtx() {
    const cont = $('#ctx');
    if (!cont) return;
    const col = LOGIC.colegio(DB, S.colegioId);
    const cur = LOGIC.curso(DB, S.cursoId);
    const ests = LOGIC.estudiantesDeCurso(DB, S.cursoId);
    let h = '<div class="row-flex" style="gap:8px">';
    if (col) {
      h += '<span class="pill low">' + esc(col.nombre) + '</span>';
      if (cur) h += '<span class="pill low">' + esc(cur.nombre) + '</span>';
      h += '<span class="pill low">' + ests.length + ' estudiantes</span>';
    }
    h += '</div>';

    if (S.ultimo) {
      h += '<div class="banner ok" style="margin-top:12px"><span class="ic">✓</span><div><strong>' + esc(S.ultimo) +

    } else if (S.editando) {
      h += '<div class="banner info" style="margin-top:12px"><span class="ic">✎</span><div><strong>Esta clase ya estaba registrada</strong><br>' +
